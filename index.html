<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.svg"><title>Strength Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:780px;margin:auto;padding:18px 15px 54px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1,h2,h3,p{margin:0}h1{font-size:25px}.muted{color:#929292;font-size:13px}.btn{border:1px solid #333;background:#181818;color:#fff;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer}.primary{background:#fff;color:#111;border-color:#fff}.danger{color:#ff8b8b}.search{margin:12px 0}.search input,input,select{width:100%;background:#171717;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;font-size:16px}label{display:block;color:#aaa;font-size:12px;margin:13px 0 6px}.card{background:#171717;border:1px solid #292929;border-radius:14px;padding:14px;margin:11px 0}.section{margin:22px 0}.back{margin-bottom:14px}.exercise{background:#171717;border:1px solid #292929;border-radius:12px;padding:11px;margin:8px 0;display:flex;gap:12px;align-items:center;cursor:pointer}.thumb{width:82px;height:62px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.visual-thumb svg{width:100%;height:100%;display:block}.exercise small{display:block;color:#999;margin-top:3px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid #333;background:#181818;color:#ddd;border-radius:999px;padding:7px 11px}.chip.active{background:#fff;color:#111}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1}.set{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:7px;align-items:center;margin:8px 0}.set span{color:#888;text-align:center}.del{background:none;border:0;color:#888;font-size:20px}.history{width:100%;border-collapse:collapse;margin-top:9px;font-size:14px}.history th,.history td{padding:8px 5px;border-bottom:1px solid #292929;text-align:left}.session-head{display:flex;justify-content:space-between;align-items:center}.chart{width:100%;height:230px;background:#121212;border-radius:10px;margin-top:10px}.note{padding:11px;background:#191919;border-radius:9px;color:#aaa;font-size:12px;line-height:1.5}.empty{padding:24px;text-align:center;color:#888}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stat{background:#121212;border-radius:10px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#888}.library-count{font-size:12px;color:#888;margin-top:3px}.visual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.visual-card{background:#171717;border:1px solid #292929;border-radius:13px;overflow:hidden;cursor:pointer}.visual-art{height:125px;background:#121212;display:flex;align-items:center;justify-content:center}.visual-art svg{width:100%;height:100%;max-width:180px}.visual-info{padding:10px}.visual-info b{font-size:14px}.visual-info small{display:block;color:#888;margin-top:3px}@media(min-width:650px){.visual-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}.ref-hero{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}.ref-art{height:110px;border-radius:14px;background:#121212;display:flex;align-items:center;justify-content:center;font-size:52px}.tag{display:inline-block;background:#242424;border:1px solid #333;border-radius:999px;padding:5px 8px;font-size:11px;color:#ccc;margin:4px 4px 0 0}.steps{padding-left:20px;color:#ccc;font-size:13px;line-height:1.55}.steps li{margin:6px 0}
</style></head><body><main><div id="app"></div></main>
<script>
const KEY="strength-log-v3";
const groups={
Chest:["Barbell Bench Press","Incline Barbell Bench Press","Decline Barbell Bench Press","Paused Bench Press","Dumbbell Bench Press","Incline Dumbbell Press","Decline Dumbbell Press","Dumbbell Fly","Incline Dumbbell Fly","Cable Fly","Low Cable Fly","High Cable Fly","Cable Crossover","Machine Chest Press","Incline Machine Press","Pec Deck","Push Up","Incline Push Up","Decline Push Up","Chest Dip"],
Back:["Conventional Deadlift","Sumo Deadlift","Rack Pull","Deficit Deadlift","Lat Pulldown","Wide Grip Lat Pulldown","Close Grip Lat Pulldown","Neutral Grip Pulldown","Pull Up","Chin Up","Assisted Pull Up","Barbell Row","Pendlay Row","T-Bar Row","Dumbbell Row","One Arm Cable Row","Seated Cable Row","Close Grip Cable Row","Chest Supported Row","Machine Row","Meadows Row","Straight Arm Pulldown","Dumbbell Pullover","Barbell Pullover"],
Quads:["Barbell Back Squat","High Bar Squat","Low Bar Squat","Front Squat","Pause Squat","Box Squat","Hack Squat","Leg Press","Single Leg Press","Leg Extension","Bulgarian Split Squat","Walking Lunge","Reverse Lunge","Forward Lunge","Dumbbell Lunge","Barbell Lunge","Goblet Squat","Heels Elevated Squat","Smith Machine Squat","Sissy Squat"],
Hamstrings:["Romanian Deadlift","Stiff Leg Deadlift","Single Leg Romanian Deadlift","Good Morning","Nordic Curl","Glute Ham Raise","Lying Leg Curl","Seated Leg Curl","Standing Leg Curl","Single Leg Curl","Cable Leg Curl","Slider Leg Curl","Stability Ball Leg Curl"],
Glutes:["Barbell Hip Thrust","Dumbbell Hip Thrust","Smith Machine Hip Thrust","Glute Bridge","Single Leg Glute Bridge","Cable Kickback","Machine Glute Kickback","45 Degree Hip Extension","Cable Pull Through","Step Up","High Step Up","Reverse Hyperextension"],
Shoulders:["Overhead Press","Push Press","Seated Barbell Press","Seated Dumbbell Shoulder Press","Arnold Press","Dumbbell Lateral Raise","Cable Lateral Raise","Machine Lateral Raise","Lean Away Lateral Raise","Front Raise","Cable Front Raise","Plate Front Raise","Rear Delt Fly","Reverse Pec Deck","Bent Over Rear Delt Raise","Cable Rear Delt Fly","Face Pull","Upright Row","Cable Upright Row","Landmine Press"],
Biceps:["Barbell Curl","EZ Bar Curl","Dumbbell Curl","Alternating Dumbbell Curl","Incline Dumbbell Curl","Hammer Curl","Cross Body Hammer Curl","Preacher Curl","Dumbbell Preacher Curl","Cable Curl","Rope Cable Curl","Bayesian Cable Curl","Spider Curl","Concentration Curl","Reverse Curl","Zottman Curl","Machine Curl"],
Triceps:["Close Grip Bench Press","Triceps Pushdown","Rope Pushdown","Straight Bar Pushdown","V Bar Pushdown","Overhead Cable Extension","Single Arm Cable Extension","Dumbbell Overhead Extension","EZ Bar Overhead Extension","Skull Crusher","Dumbbell Skull Crusher","Cable Skull Crusher","Tate Press","JM Press","Bench Dip","Parallel Bar Dip","Assisted Dip","Triceps Kickback"],
Calves:["Standing Calf Raise","Seated Calf Raise","Leg Press Calf Raise","Donkey Calf Raise","Smith Machine Calf Raise","Single Leg Calf Raise","Bodyweight Calf Raise","Tibialis Raise"],
Core:["Cable Crunch","Machine Crunch","Weighted Crunch","Hanging Knee Raise","Hanging Leg Raise","Captain's Chair Knee Raise","Reverse Crunch","Ab Wheel Rollout","Plank","Weighted Plank","Side Plank","Dead Bug","Bird Dog","Pallof Press","Cable Wood Chop","Cable Lift","Russian Twist","Bicycle Crunch","V Up","Sit Up","Decline Sit Up","Toe Touch","Dragon Flag"],
Forearms:["Wrist Curl","Reverse Wrist Curl","Behind Back Wrist Curl","Reverse Barbell Curl","Farmer Carry","Suitcase Carry","Plate Pinch Hold","Dead Hang"],
"Full Body":["Barbell Clean","Power Clean","Hang Clean","Clean and Press","Push Jerk","Split Jerk","Snatch","Hang Snatch","Dumbbell Clean","Dumbbell Clean and Press","Kettlebell Swing","Turkish Get Up","Thruster","Man Maker","Sled Push","Sled Drag"]
};
const iconFor=g=>({Chest:"🏋️",Back:"🦾",Quads:"🦵",Hamstrings:"🦵",Glutes:"🍑",Shoulders:"💪",Biceps:"💪",Triceps:"💪",Calves:"🦵",Core:"◈",Forearms:"🤝","Full Body":"🏋️"})[g]||"🏋️";
const typeFor=n=>/dumbbell|single leg|alternating|hammer|goblet|arnold|lateral raise|front raise|preacher|concentration|zottman|kickback|tate press|turkish|man maker|thruster/i.test(n)?"dumbbell":/cable|pulldown|pushdown|extension|face pull|crossover|kickback|pallof|wood chop|cable lift|leg curl/i.test(n)?"cable":/machine|pec deck|hack squat|leg press|smith|captain|sled/i.test(n)?"machine":/push up|pull up|chin up|dip|plank|dead bug|bird dog|v up|sit up|toe touch|dragon flag|bodyweight|dead hang|nordic|glute ham|lunge|step up|calf raise/i.test(n)?"bodyweight":"barbell";
const starter=Object.entries(groups).flatMap(([g,ns])=>ns.map(n=>[n,g,typeFor(n),iconFor(g)]));
let raw=localStorage.getItem(KEY),old=localStorage.getItem("strength-log-v2"),data=raw?JSON.parse(raw):old?JSON.parse(old):null;
if(!data){data={exercises:[],sessions:[]};} 
const existing=new Set(data.exercises.map(e=>e.name.toLowerCase()));
starter.forEach((x,i)=>{if(!existing.has(x[0].toLowerCase()))data.exercises.push({id:"e"+i,name:x[0],group:x[1],type:x[2],icon:x[3],builtin:true});});
save();
const app=document.getElementById("app");let filter="All";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function lastFor(id){return data.sessions.filter(s=>s.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt)[0]}
function visualSVG(e){const n=e.name.toLowerCase();let pose="strength";if(/bench press|chest press|push up|dip/.test(n))pose="press";else if(/squat|lunge|leg press|extension|split squat|step up/.test(n))pose="squat";else if(/deadlift|row|pulldown|pull up|chin up|pullover/.test(n))pose="pull";else if(/curl/.test(n))pose="curl";else if(/lateral raise|front raise|shoulder press|overhead press|face pull|upright row/.test(n))pose="shoulder";else if(/calf|tibialis/.test(n))pose="calf";else if(/crunch|plank|ab |abs|knee raise|leg raise|rollout|sit up|wood chop/.test(n))pose="core";const equip=e.type==="barbell"?"barbell":e.type==="dumbbell"?"dumbbell":e.type==="cable"?"cable":e.type==="machine"?"machine":"bodyweight";const paths={press:"M88 112 L125 80 L162 112 M100 78 L150 78 M75 48 H175",squat:"M125 42 L125 78 L92 118 M125 78 L158 118 M95 62 H155",pull:"M125 45 L125 82 M125 58 L88 86 M125 58 L162 86 M125 82 L98 120 M125 82 L152 120",curl:"M125 48 L125 82 M125 62 L92 92 M125 62 L158 92 M125 82 L102 120 M125 82 L148 120",shoulder:"M125 45 L125 85 M125 62 L72 45 M125 62 L178 45 M125 85 L100 120 M125 85 L150 120",calf:"M125 45 L125 82 M125 82 L105 125 M125 82 L145 125",core:"M90 92 Q125 58 160 92 M100 92 L80 120 M150 92 L170 120"};const extra=equip==="barbell"?'<path d="M55 48H195M68 38V58M182 38V58" stroke="#aaa" stroke-width="7" stroke-linecap="round"/>':equip==="dumbbell"?'<path d="M70 88H95M155 88H180M78 80V96M172 80V96" stroke="#aaa" stroke-width="8" stroke-linecap="round"/>':equip==="cable"?'<path d="M205 25V125M205 45L160 65" stroke="#777" stroke-width="4"/><circle cx="205" cy="25" r="8" fill="#aaa"/>':equip==="machine"?'<rect x="190" y="55" width="25" height="75" rx="5" fill="#333" stroke="#777" stroke-width="3"/>':'';return `<svg viewBox="0 0 250 145" xmlns="http://www.w3.org/2000/svg" aria-label="${esc(e.name)}"><rect width="250" height="145" fill="#121212"/><circle cx="125" cy="27" r="13" fill="none" stroke="#aaa" stroke-width="5"/><path d="${paths[pose]}" fill="none" stroke="#777" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>${extra}<text x="125" y="137" text-anchor="middle" fill="#999" font-size="11">${esc(e.group)}</text></svg>`}
function row(e,sub=""){return `<div class="exercise" onclick="openExercise('${e.id}')"><div class="thumb visual-thumb">${visualSVG(e)}</div><div style="flex:1"><b>${esc(e.name)}</b><small>${esc(sub||e.group)}</small></div><span>›</span></div>`}
function home(){
let groupsUsed={};data.exercises.filter(e=>data.sessions.some(s=>s.exerciseId===e.id)).forEach(e=>(groupsUsed[e.group]??=[]).push(e));
app.innerHTML=`<div class="top"><div><h1>Strength Log</h1><div class="muted">Log. Compare. Get stronger.</div></div><button class="btn" onclick="library()">＋ Exercise</button></div>
${Object.keys(groupsUsed).length?Object.entries(groupsUsed).map(([g,es])=>`<div class="section"><h3>${esc(g)}</h3>${es.map(e=>{let l=lastFor(e.id),t=l?.sets?.[0];return row(e,t?`${t.weight} kg × ${t.reps}`:"")}).join("")}</div>`).join(""):`<div class="card empty">No exercises logged yet.<br><br><button class="btn primary" onclick="library()">Choose an exercise</button></div>`}
<div class="section"><div class="card"><b>Data</b><div class="muted" style="margin:5px 0 12px">Your workouts stay on this device.</div><div class="actions"><button class="btn" onclick="backup()">Export backup</button><button class="btn" onclick="restore()">Import backup</button></div></div></div>`}
function library(){
filter="All";app.innerHTML=`<button class="btn back" onclick="home()">← Back</button><div class="top"><div><h2>Exercise library</h2><div class="library-count">${data.exercises.length} exercises · 13 muscle groups</div></div><div class="actions"><button class="btn" onclick="visualLibrary()">Visual</button><button class="btn" onclick="customExercise()">＋ Custom</button></div></div>
<div class="search"><input id="q" placeholder="Search exercises..." oninput="renderLibrary()"></div><div class="chips" id="chips"><button class="chip active" data-g="All" onclick="setFilter('All')">All</button>${Object.keys(groups).map(g=>`<button class="chip" data-g="${esc(g)}" onclick="setFilter('${esc(g)}')">${esc(g)}</button>`).join("")}</div><div id="lib"></div>`;renderLibrary()}
function visualSVG(e){const a=e.type==="barbell"?"━":e.type==="dumbbell"?"╋":e.type==="machine"?"▣":e.type==="cable"?"⌁":"●";const body=e.group==="Chest"?"M90 75 Q125 50 160 75 L150 125 Q125 140 100 125Z":e.group==="Back"?"M92 70 Q125 48 158 70 L148 130 Q125 145 102 130Z":"M105 68 L145 68 L153 125 L97 125Z";return `<svg viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg"><rect width="250" height="150" fill="#121212"/><circle cx="125" cy="32" r="14" fill="none" stroke="#888" stroke-width="5"/><path d="${body}" fill="#292929" stroke="#777" stroke-width="4"/><path d="M105 78 L72 105 M145 78 L178 105 M112 122 L95 143 M138 122 L155 143" fill="none" stroke="#777" stroke-width="7" stroke-linecap="round"/><text x="125" y="19" text-anchor="middle" fill="#aaa" font-size="12">${esc(e.group)}</text><text x="125" y="143" text-anchor="middle" fill="#ddd" font-size="18">${a}</text></svg>`}
function visualLibrary(){
  filter="All";
  let chips='<button class="chip active" data-g="All" onclick="setVisualFilter(\'All\')">All</button>';
  Object.keys(groups).forEach(g=>{
    chips+='<button class="chip" data-g="'+esc(g)+'" onclick="setVisualFilter(\''+esc(g)+'\')">'+esc(g)+'</button>';
  });
  app.innerHTML='<button class="btn back" onclick="home()">← Back</button><div class="top"><div><h2>Visual library</h2><div class="library-count">'+data.exercises.length+' exercises</div></div><button class="btn" onclick="library()">List view</button></div><div class="search"><input id="vq" placeholder="Search exercises..." oninput="renderVisualLibrary()"></div><div class="chips" id="vchips">'+chips+'</div><div id="vlib"></div>';
  renderVisualLibrary();
}
function setVisualFilter(g){filter=g;document.querySelectorAll("#vchips .chip").forEach(b=>b.classList.toggle("active",b.dataset.g===g));renderVisualLibrary()}
function renderVisualLibrary(){let q=(document.getElementById("vq")?.value||"").toLowerCase();let xs=data.exercises.filter(e=>(filter==="All"||e.group===filter)&&(!q||e.name.toLowerCase().includes(q)||e.group.toLowerCase().includes(q)));document.getElementById("vlib").innerHTML=`<div class="visual-grid">${xs.map(e=>`<div class="visual-card" onclick="openExercise('${e.id}')"><div class="visual-art">${visualSVG(e)}</div><div class="visual-info"><b>${esc(e.name)}</b><small>${esc(e.group)} · ${esc(e.type)}</small></div></div>`).join("")}</div>`||'<div class="empty">No exercise found.</div>'}
function setFilter(g){filter=g;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.g===g));renderLibrary()}
function renderLibrary(){let q=(document.getElementById("q")?.value||"").toLowerCase();let xs=data.exercises.filter(e=>(filter==="All"||e.group===filter)&&(!q||e.name.toLowerCase().includes(q)||e.group.toLowerCase().includes(q)));document.getElementById("lib").innerHTML=xs.map(e=>row(e,lastFor(e.id)?lastFor(e.id).sets.map(s=>s.weight+" kg × "+s.reps).join(" · "):e.group)).join("")||'<div class="empty">No exercise found.</div>'}
function customExercise(){app.innerHTML=`<button class="btn back" onclick="library()">← Library</button><h2>Custom exercise</h2><label>Exercise name</label><input id="ename" placeholder="e.g. Hammer Strength Press"><label>Muscle group</label><input id="egroup" placeholder="e.g. Chest"><label>Weight convention</label><select id="etype"><option value="barbell">Barbell · total weight including bar</option><option value="dumbbell">Dumbbell · one dumbbell</option><option value="machine">Machine / stack selected</option><option value="bodyweight">Bodyweight</option><option value="other">Other</option></select><div style="margin-top:18px"><button class="btn primary" onclick="createCustom()">Create exercise</button></div>`}
function createCustom(){let n=ename.value.trim();if(!n)return alert("Enter a name.");let e={id:crypto.randomUUID(),name:n,group:egroup.value.trim()||"Other",type:etype.value,icon:"🏋️",builtin:false};data.exercises.push(e);save();openExercise(e.id)}
function metaFor(e){const g=e.group;const primary={Chest:"Pectorals",Back:"Lats / upper back",Quads:"Quadriceps",Hamstrings:"Hamstrings",Glutes:"Glutes",Shoulders:"Deltoids",Biceps:"Biceps",Triceps:"Triceps",Calves:"Calves",Core:"Abdominals / core",Forearms:"Forearms","Full Body":"Full body"}[g]||g;const secondary={Chest:"Triceps · front delts",Back:"Biceps · rear delts",Quads:"Glutes · adductors",Hamstrings:"Glutes · lower back",Glutes:"Hamstrings · core",Shoulders:"Triceps · upper chest",Biceps:"Forearms",Triceps:"Chest · shoulders",Calves:"Foot / ankle stabilizers",Core:"Hip flexors · obliques",Forearms:"Grip", "Full Body":"Multiple muscle groups"}[g]||"";const how={barbell:"Use the total loaded barbell weight.",dumbbell:"Record the weight of one dumbbell.",machine:"Record the selected machine / stack weight.",cable:"Record the selected cable / stack weight.",bodyweight:"Use 0 kg for bodyweight-only work, or add external load.",other:"Use the same measurement convention each session."}[e.type]||"";const tips={Chest:["Set your position and brace before the first rep.","Control the lowering phase and keep the target muscle loaded.","Use a consistent range of motion each session."],Back:["Set your torso and brace before pulling.","Drive the movement with the target back muscles rather than momentum.","Control the return to the starting position."],Quads:["Keep your feet and knee path consistent.","Control the descent and use a comfortable depth.","Drive through the whole foot."],Hamstrings:["Keep the hips controlled and avoid rushing the eccentric.","Use a comfortable stretch without forcing range.","Keep the movement consistent between sessions."],Glutes:["Brace the trunk and keep the pelvis controlled.","Squeeze the glutes at the end of the movement.","Avoid compensating with the lower back."],Shoulders:["Use a stable torso and controlled path.","Avoid swinging the weight.","Stop the range where you can maintain good control."],Biceps:["Keep the upper arm controlled.","Curl without swinging the torso.","Lower the weight under control."],Triceps:["Keep the upper arm stable where practical.","Move through a controlled elbow extension.","Avoid using momentum."],Calves:["Use a full comfortable range of motion.","Pause briefly at the top when practical.","Control the stretch at the bottom."],Core:["Brace before each repetition.","Keep the trunk position controlled.","Stop before technique breaks down."],Forearms:["Use a controlled range rather than bouncing.","Keep the wrist position consistent.","Progress gradually to protect the grip and wrists."],"Full Body":["Set up the movement before initiating the rep.","Keep technique consistent before adding load.","Use controlled repetitions and appropriate rest."]}[g]||["Set up consistently.","Use controlled repetitions.","Progress gradually."];return {primary,secondary,how,tips}}\nfunction referenceCard(e){const m=metaFor(e);return `<div class="card"><div class="ref-hero"><div class="ref-art">${e.icon||"🏋️"}</div><div><h3>Exercise reference</h3><div style="margin-top:5px"><span class="tag">Primary · ${esc(m.primary)}</span><span class="tag">Equipment · ${esc(e.type)}</span></div><div class="muted" style="margin-top:7px">${esc(m.how)}</div></div></div><div style="margin-top:14px"><b>Technique cues</b><ol class="steps">${m.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div></div>`}\nfunction openExercise(id){
let e=data.exercises.find(x=>x.id===id),sessions=data.sessions.filter(x=>x.exerciseId===id);let allSets=sessions.flatMap(s=>s.sets);let top=allSets.length?Math.max(...allSets.map(s=>+s.weight||0)):0;
app.innerHTML=`<button class="btn back" onclick="home()">← Exercises</button><div class="top"><div><h2>${esc(e.name)}</h2><div class="muted">${esc(e.group)} · ${esc(e.type)}</div></div><button class="btn primary" onclick="log('${id}')">＋ Log</button></div>${referenceCard(e)}
<div class="stats"><div class="stat"><b>${top?top+" kg":"—"}</b><span>Best weight</span></div><div class="stat"><b>${sessions.length}</b><span>Workouts</span></div></div>
<div class="tabs"><button class="btn primary" onclick="showHistory('${id}')">History</button><button class="btn" onclick="showGraph('${id}')">Progress</button></div><div id="detail"></div>`;showHistory(id)}
function showHistory(id){let s=data.sessions.filter(x=>x.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);document.getElementById("detail").innerHTML=s.length?`<div class="card">${s.map(x=>`<div style="margin-bottom:18px"><div class="session-head"><b>${new Date(x.date+"T00:00:00").toLocaleDateString()}</b><button class="btn danger" onclick="deleteSession('${x.id}','${id}')">Delete</button></div><table class="history"><tr><th>Set</th><th>Weight</th><th>Reps</th></tr>${x.sets.map((z,i)=>`<tr><td>${i+1}</td><td>${z.weight} kg</td><td>${z.reps}</td></tr>`).join("")}</table></div>`).join("")}</div>`:'<div class="card empty">No workouts logged yet.</div>'}
function deleteSession(sid,id){if(!confirm("Delete this workout?"))return;data.sessions=data.sessions.filter(s=>s.id!==sid);save();openExercise(id)}
function showGraph(id){let s=data.sessions.filter(x=>x.exerciseId===id).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);let top=s.map(x=>({value:Math.max(...x.sets.map(z=>+z.weight||0)),label:x.date.slice(5)})),vol=s.map(x=>({value:x.sets.reduce((a,z)=>a+(+z.weight||0)*(+z.reps||0),0),label:x.date.slice(5)}));document.getElementById("detail").innerHTML='<div class="card"><b>Top weight</b><canvas class="chart" id="chart"></canvas></div><div class="card"><b>Workout volume</b><canvas class="chart" id="vol"></canvas></div>';draw("chart",top,"kg");draw("vol",vol,"kg × reps")}
function draw(id,pts,unit){let c=document.getElementById(id),ctx=c.getContext("2d"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;ctx.scale(d,d);ctx.clearRect(0,0,w,h);if(!pts.length){ctx.fillStyle="#777";ctx.fillText("No data yet",16,30);return}let pad=42,min=Math.min(...pts.map(p=>p.value)),max=Math.max(...pts.map(p=>p.value)),range=max-min||1;ctx.font="11px system-ui";ctx.fillStyle="#777";ctx.strokeStyle="#333";ctx.beginPath();ctx.moveTo(pad,12);ctx.lineTo(pad,h-32);ctx.lineTo(w-10,h-32);ctx.stroke();ctx.fillText(Math.round(max)+" "+unit,5,18);ctx.fillText(Math.round(min)+" "+unit,5,h-36);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>{let x=pad+(w-pad-20)*(pts.length===1?.5:i/(pts.length-1)),y=12+(h-48)*(1-(p.value-min)/range);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="#aaa";pts.forEach((p,i)=>{let x=pad+(w-pad-20)*(pts.length===1?.5:i/(pts.length-1));if(i===0||i===pts.length-1||pts.length<7)ctx.fillText(p.label,x-15,h-12)})}
function log(id){let e=data.exercises.find(x=>x.id===id),last=lastFor(id),sets=(last?.sets||[{weight:"",reps:""}]).map(x=>({...x}));app.innerHTML=`<button class="btn back" onclick="openExercise('${id}')">← ${esc(e.name)}</button><h2>Log workout</h2><div class="muted">Previous workout pre-filled.</div><div class="card"><div id="sets">${sets.map((x,i)=>setRow(i,x)).join("")}</div><button class="btn" onclick="addSet()">＋ Set</button></div><div class="note">Barbell = total weight including bar. Dumbbell = weight of one dumbbell. Machine/cable = selected stack weight. Bodyweight exercises can be logged as 0 kg if desired.</div><div style="margin-top:15px"><button class="btn primary" onclick="saveWorkout('${id}')">Save workout</button></div>`}
function setRow(i,x={weight:"",reps:""}){return `<div class="set"><span>${i+1}</span><input class="wt" type="number" step="0.5" value="${esc(x.weight)}" placeholder="kg"><input class="rp" type="number" value="${esc(x.reps)}" placeholder="reps"><button class="del" onclick="this.parentElement.remove()">×</button></div>`}
function addSet(){document.getElementById("sets").insertAdjacentHTML("beforeend",setRow(document.querySelectorAll(".set").length))}
function saveWorkout(id){let sets=[...document.querySelectorAll(".set")].map(r=>({weight:+r.querySelector(".wt").value||0,reps:+r.querySelector(".rp").value||0})).filter(x=>x.reps>0);if(!sets.length)return alert("Enter at least one set.");data.sessions.push({id:crypto.randomUUID(),exerciseId:id,date:new Date().toISOString().slice(0,10),createdAt:Date.now(),sets});save();openExercise(id)}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="strength-log-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.exercises||!x.sessions)throw 0;data=x;save();home()}catch(e){alert("Invalid backup.")}};r.readAsText(i.files[0])};i.click()}
home();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body></html>
