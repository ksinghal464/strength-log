<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010"><link rel="manifest" href="manifest.webmanifest">
<title>Strength Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f2f2f2;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:auto;padding:16px 15px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}h1,h2,h3,p{margin:0}.muted{color:#969696;font-size:13px}.btn{border:1px solid #333;background:#1a1a1a;color:#fff;border-radius:10px;padding:10px 13px;font-weight:650}.primary{background:#fff;color:#111;border-color:#fff}.search{margin:10px 0 14px}.search input,input,select{width:100%;background:#181818;color:#fff;border:1px solid #333;border-radius:9px;padding:11px;font-size:16px}label{display:block;color:#aaa;font-size:12px;margin:12px 0 6px}.card{background:#181818;border:1px solid #292929;border-radius:13px;padding:14px;margin:11px 0}.exercise{background:#181818;border:1px solid #292929;border-radius:12px;padding:11px;margin:8px 0;display:flex;gap:12px;align-items:center;cursor:pointer}.thumb{width:58px;height:58px;border-radius:9px;background:#222;display:flex;align-items:center;justify-content:center;font-size:27px;flex:none}.exercise small{display:block;color:#999;margin-top:3px}.section{margin:20px 0}.back{margin-bottom:14px}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1}.set{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:7px;align-items:center;margin:8px 0}.set span{color:#888;text-align:center}.del{background:none;border:0;color:#888;font-size:20px}.history{width:100%;border-collapse:collapse;margin-top:9px;font-size:14px}.history th,.history td{padding:8px 5px;border-bottom:1px solid #292929;text-align:left}canvas{width:100%;height:220px;background:#141414;border-radius:10px;margin-top:10px}.note{padding:10px;background:#191919;border-radius:9px;color:#aaa;font-size:12px;line-height:1.45}.actions,.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{white-space:nowrap;border:1px solid #333;background:#181818;color:#ddd;border-radius:999px;padding:7px 11px}.chip.active{background:#fff;color:#111}.empty{padding:20px;text-align:center;color:#888}
</style></head><body><main><div id="app"></div></main>
<script>
const KEY="strength-log-v2";
const starter=[["Barbell Bench Press","Chest","barbell","🏋️"],["Incline Barbell Bench Press","Chest","barbell","🏋️"],["Dumbbell Bench Press","Chest","dumbbell","💪"],["Incline Dumbbell Press","Chest","dumbbell","💪"],["Dumbbell Fly","Chest","dumbbell","💪"],["Cable Fly","Chest","cable","🔗"],["Machine Chest Press","Chest","machine","▣"],["Barbell Back Squat","Quads","barbell","🏋️"],["Front Squat","Quads","barbell","🏋️"],["Leg Press","Quads","machine","▣"],["Leg Extension","Quads","machine","▣"],["Bulgarian Split Squat","Quads","dumbbell","💪"],["Goblet Squat","Quads","dumbbell","💪"],["Romanian Deadlift","Hamstrings","barbell","🏋️"],["Lying Leg Curl","Hamstrings","machine","▣"],["Seated Leg Curl","Hamstrings","machine","▣"],["Good Morning","Hamstrings","barbell","🏋️"],["Barbell Hip Thrust","Glutes","barbell","🏋️"],["Dumbbell Hip Thrust","Glutes","dumbbell","💪"],["Cable Kickback","Glutes","cable","🔗"],["Glute Bridge","Glutes","bodyweight","🧍"],["Conventional Deadlift","Back","barbell","🏋️"],["Lat Pulldown","Back","cable","🔗"],["Pull Up","Back","bodyweight","🧍"],["Chin Up","Back","bodyweight","🧍"],["Barbell Row","Back","barbell","🏋️"],["Dumbbell Row","Back","dumbbell","💪"],["Seated Cable Row","Back","cable","🔗"],["Chest Supported Row","Back","machine","▣"],["Straight Arm Pulldown","Back","cable","🔗"],["Overhead Press","Shoulders","barbell","🏋️"],["Seated Dumbbell Shoulder Press","Shoulders","dumbbell","💪"],["Dumbbell Lateral Raise","Shoulders","dumbbell","💪"],["Cable Lateral Raise","Shoulders","cable","🔗"],["Rear Delt Fly","Shoulders","machine","▣"],["Face Pull","Shoulders","cable","🔗"],["Barbell Curl","Biceps","barbell","🏋️"],["Dumbbell Curl","Biceps","dumbbell","💪"],["Hammer Curl","Biceps","dumbbell","💪"],["Preacher Curl","Biceps","machine","▣"],["Cable Curl","Biceps","cable","🔗"],["Close Grip Bench Press","Triceps","barbell","🏋️"],["Triceps Pushdown","Triceps","cable","🔗"],["Overhead Cable Extension","Triceps","cable","🔗"],["Skull Crusher","Triceps","barbell","🏋️"],["Dumbbell Overhead Extension","Triceps","dumbbell","💪"],["Standing Calf Raise","Calves","machine","▣"],["Seated Calf Raise","Calves","machine","▣"],["Calf Raise","Calves","bodyweight","🧍"],["Cable Crunch","Core","cable","🔗"],["Hanging Knee Raise","Core","bodyweight","🧍"],["Plank","Core","bodyweight","🧍"],["Ab Wheel Rollout","Core","bodyweight","🧍"],["Wrist Curl","Forearms","dumbbell","💪"],["Reverse Wrist Curl","Forearms","dumbbell","💪"]];
let data=JSON.parse(localStorage.getItem(KEY)||"null");if(!data){data={exercises:starter.map((x,i)=>({id:"e"+i,name:x[0],group:x[1],type:x[2],icon:x[3]})),sessions:[]};save()}
const app=document.getElementById("app");let filter="All";const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function lastFor(id){return data.sessions.filter(s=>s.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt)[0]}
function row(e,sub=""){return `<div class="exercise" onclick="openExercise('${e.id}')"><div class="thumb">${e.icon||"🏋️"}</div><div style="flex:1"><b>${esc(e.name)}</b><small>${esc(sub||e.group)}</small></div><span>›</span></div>`}
function home(){let groups={};data.exercises.filter(e=>data.sessions.some(s=>s.exerciseId===e.id)).forEach(e=>(groups[e.group]??=[]).push(e));app.innerHTML=`<div class="top"><div><h1>Strength Log</h1><div class="muted">Log. Compare. Get stronger.</div></div><button class="btn" onclick="library()">＋ Exercise</button></div>${Object.keys(groups).length?Object.entries(groups).map(([g,es])=>`<div class="section"><h3>${esc(g)}</h3>${es.map(e=>{let l=lastFor(e.id),t=l?.sets?.[0];return row(e,t?`${t.weight} kg × ${t.reps}`:"")}).join("")}</div>`).join(""):`<div class="card empty">No exercises logged yet.<br><br><button class="btn primary" onclick="library()">Choose an exercise</button></div>`}`}
function library(){let groups=[...new Set(data.exercises.map(e=>e.group))].sort();app.innerHTML=`<button class="btn back" onclick="home()">← Back</button><div class="top"><div><h2>Exercise library</h2><div class="muted">${data.exercises.length} exercises</div></div><button class="btn" onclick="customExercise()">＋ Custom</button></div><div class="search"><input id="q" placeholder="Search exercises..." oninput="renderLibrary()"></div><div class="chips"><button class="chip active" onclick="filter='All';renderLibrary()">All</button>${groups.map(g=>`<button class="chip" onclick="filter='${esc(g)}';renderLibrary()">${esc(g)}</button>`).join("")}</div><div id="lib"></div>`;renderLibrary()}
function renderLibrary(){let q=(document.getElementById("q")?.value||"").toLowerCase();let xs=data.exercises.filter(e=>(filter==="All"||e.group===filter)&&(!q||e.name.toLowerCase().includes(q)||e.group.toLowerCase().includes(q)));document.getElementById("lib").innerHTML=xs.map(e=>row(e,lastFor(e.id)?lastFor(e.id).sets[0].weight+" kg × "+lastFor(e.id).sets[0].reps:e.group)).join("")||'<div class="empty">No exercise found.</div>'}
function customExercise(){app.innerHTML=`<button class="btn back" onclick="library()">← Library</button><h2>Custom exercise</h2><label>Exercise name</label><input id="ename" placeholder="e.g. Hammer Strength Press"><label>Muscle group</label><input id="egroup" placeholder="e.g. Chest"><label>Weight type</label><select id="etype"><option>Total barbell weight</option><option>Per dumbbell</option><option>Machine / stack</option><option>Bodyweight</option><option>Other</option></select><div style="margin-top:18px"><button class="btn primary" onclick="createCustom()">Create</button></div>`}
function createCustom(){let n=ename.value.trim();if(!n)return alert("Enter a name.");let e={id:crypto.randomUUID(),name:n,group:egroup.value.trim()||"Other",type:etype.value,icon:"🏋️"};data.exercises.push(e);save();openExercise(e.id)}
function openExercise(id){let e=data.exercises.find(x=>x.id===id);app.innerHTML=`<button class="btn back" onclick="home()">← Exercises</button><div class="top"><div><h2>${esc(e.name)}</h2><div class="muted">${esc(e.group)} · ${esc(e.type)}</div></div><button class="btn" onclick="log('${id}')">＋ Log</button></div><div class="tabs"><button class="btn primary" onclick="showHistory('${id}')">History</button><button class="btn" onclick="showGraph('${id}')">Progress</button></div><div id="detail"></div>`;showHistory(id)}
function showHistory(id){let s=data.sessions.filter(x=>x.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);document.getElementById("detail").innerHTML=s.length?`<div class="card">${s.map(x=>`<div style="margin-bottom:16px"><b>${new Date(x.date+"T00:00:00").toLocaleDateString()}</b><table class="history"><tr><th>Set</th><th>Weight</th><th>Reps</th></tr>${x.sets.map((z,i)=>`<tr><td>${i+1}</td><td>${z.weight} kg</td><td>${z.reps}</td></tr>`).join("")}</table></div>`).join("")}</div>`:'<div class="card empty">No workouts logged yet.</div>'}
function showGraph(id){let s=data.sessions.filter(x=>x.exerciseId===id).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt),top=s.map(x=>({value:Math.max(...x.sets.map(z=>+z.weight||0))})),vol=s.map(x=>({value:x.sets.reduce((a,z)=>a+(+z.weight||0)*(+z.reps||0),0)}));document.getElementById("detail").innerHTML='<div class="card"><b>Top weight</b><canvas id="chart"></canvas></div><div class="card"><b>Workout volume</b><canvas id="vol"></canvas></div>';draw("chart",top);draw("vol",vol)}
function draw(id,pts){let c=document.getElementById(id),ctx=c.getContext("2d"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;ctx.scale(d,d);if(!pts.length){ctx.fillStyle="#777";ctx.fillText("No data yet",16,30);return}let pad=35,min=Math.min(...pts.map(p=>p.value)),max=Math.max(...pts.map(p=>p.value)),range=max-min||1;ctx.strokeStyle="#333";ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,h-28);ctx.lineTo(w-10,h-28);ctx.stroke();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>{let x=pad+(w-pad-20)*(pts.length===1?.5:i/(pts.length-1)),y=10+(h-48)*(1-(p.value-min)/range);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function log(id){let e=data.exercises.find(x=>x.id===id),last=lastFor(id),sets=(last?.sets||[{weight:"",reps:""}]).map(x=>({...x}));app.innerHTML=`<button class="btn back" onclick="openExercise('${id}')">← ${esc(e.name)}</button><h2>Log workout</h2><div class="muted">Previous workout pre-filled.</div><div class="card"><div id="sets">${sets.map((x,i)=>setRow(i,x)).join("")}</div><button class="btn" onclick="addSet()">＋ Set</button></div><div class="note">Barbell = total weight including bar. Dumbbell = weight of one dumbbell. Machine/cable = selected stack weight.</div><div style="margin-top:15px"><button class="btn primary" onclick="saveWorkout('${id}')">Save workout</button></div>`}
function setRow(i,x={weight:"",reps:""}){return `<div class="set"><span>${i+1}</span><input class="wt" type="number" step="0.5" value="${esc(x.weight)}" placeholder="kg"><input class="rp" type="number" value="${esc(x.reps)}" placeholder="reps"><button class="del" onclick="this.parentElement.remove()">×</button></div>`}
function addSet(){document.getElementById("sets").insertAdjacentHTML("beforeend",setRow(document.querySelectorAll(".set").length))}
function saveWorkout(id){let sets=[...document.querySelectorAll(".set")].map(r=>({weight:+r.querySelector(".wt").value,reps:+r.querySelector(".rp").value})).filter(x=>x.weight>0&&x.reps>0);if(!sets.length)return alert("Enter at least one set.");data.sessions.push({id:crypto.randomUUID(),exerciseId:id,date:new Date().toISOString().slice(0,10),createdAt:Date.now(),sets});save();openExercise(id)}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="strength-log-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.exercises||!x.sessions)throw 0;data=x;save();home()}catch(e){alert("Invalid backup.")}};r.readAsText(i.files[0])};i.click()}
home();
</script></body></html>
